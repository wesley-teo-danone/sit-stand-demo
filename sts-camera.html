<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>STS Frontend Library Demo</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Add these 2 lines to the page that you are calling ironai-camera to enable the styling by Shoelace -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace.js"></script>
    <!--Until here -->
    <script type="module"
        src="https://digital-health-services-apac-beta.hive.digital4danone.com/fe-ai-sdk/df-digital-health.sts-fe-lib/latest/components/sts-camera.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .dev-skip-btn {
            position: fixed;
            top: 0;
            right: 0;
            width: 150px;
            height: 150px;
            opacity: 0;
            z-index: 9999;
        }
    </style>
</head>

<body>
    <button id="devSkipBtn" type="button" class="dev-skip-btn" aria-label="Skip"></button>
    <sts-camera></sts-camera>
    <script>
        // Dev skip button functionality - sets dummy results and navigates to the questionnaire page for testing/demo purposes
        document.getElementById('devSkipBtn').addEventListener('click', function () {
            localStorage.setItem('sts-fe-results', JSON.stringify({
                reps: 100,
                full_rep_counter: 100,
                partial_rep_counter: 0,
            }));
            window.location.href = 'malnutrition-questionnaire.html';
        });

        document.addEventListener("DOMContentLoaded", async () => {
            const camera = document.querySelector("sts-camera");
            try {
                await camera.startCamera();
            } catch (error) {
                alert(error);
                console.error(error.description);
            }
        });
        window.addEventListener("sts-fe-results", (event) => {
            localStorage.setItem("sts-fe-results", JSON.stringify(event.detail));
            window.location.href = "malnutrition-questionnaire.html";
        });
    </script>
</body>

</html>
